<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inside a motorcycle gearbox — an interactive transmission</title>
  <meta name="description" content="Shift gears and watch the torque path re-route through a six-speed sequential motorcycle gearbox, with a live clutch, dog rings and shift drum.">
  <meta name="color-scheme" content="dark">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Inside a motorcycle gearbox</h1>
      <div class="header-slots">
        <div id="live" class="mono" aria-live="off"></div>
        <div id="mode"></div>
      </div>
    </header>
    <main class="app-main">
      <section id="stage" aria-label="Gearbox"><p id="status" class="status"></p></section>
      <section id="deck" aria-label="Controls"></section>
      <aside id="panel" aria-label="Information"></aside>
      <noscript>
        <div class="noscript-note">
          <h2>This page needs JavaScript</h2>
          <p>It is an interactive simulation of a motorcycle clutch and six-speed sequential gearbox. Without JavaScript, here are its gear ratios, representative of a middleweight sport bike. The gearbox ratio is input shaft turns per output shaft turn; the overall ratio multiplies in the primary drive (76:36) and the chain (45:16), so it is crankshaft turns per rear wheel turn.</p>
          <table>
            <thead><tr><th scope="col">Gear</th><th scope="col">Gearbox</th><th scope="col">Overall</th></tr></thead>
            <tbody>
              <tr><th scope="row">1st</th><td>37/13 = 2.846</td><td>16.90</td></tr>
              <tr><th scope="row">2nd</th><td>33/17 = 1.941</td><td>11.53</td></tr>
              <tr><th scope="row">3rd</th><td>31/19 = 1.632</td><td>9.69</td></tr>
              <tr><th scope="row">4th</th><td>29/21 = 1.381</td><td>8.20</td></tr>
              <tr><th scope="row">5th</th><td>27/23 = 1.174</td><td>6.97</td></tr>
              <tr><th scope="row">6th</th><td>26/24 = 1.083</td><td>6.43</td></tr>
            </tbody>
          </table>
        </div>
      </noscript>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
