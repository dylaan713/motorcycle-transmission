<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inside a motorcycle gearbox — an interactive transmission</title>
  <meta name="description" content="Shift gears and watch the torque path re-route through a six-speed sequential motorcycle gearbox, with a live clutch, dog rings and shift drum.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5.5' fill='none' stroke='%23F2F4F6' stroke-width='3' stroke-dasharray='2.16 2.16'/%3E%3Ccircle cx='8' cy='8' r='4' fill='none' stroke='%23F2F4F6' stroke-width='1.5'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title">
        <h1 class="type-expanded">Inside a motorcycle gearbox</h1>
        <p class="title-note" aria-hidden="true">live simulation · simplified model</p>
      </div>
      <div id="mode"></div>
    </header>
    <main class="app-main">
      <section id="stage" aria-label="Gearbox"><p id="status" class="status"></p></section>
      <div id="lessons"></div>
      <section id="deck" aria-label="Controls"></section>
      <aside id="panel" aria-labelledby="panel-title"></aside>
      <noscript>
        <div class="noscript-note">
          <h2>This page needs JavaScript</h2>
          <p>It is an interactive simulation of a motorcycle clutch and six-speed sequential gearbox. Without JavaScript, here are its gear ratios, representative of a middleweight sport bike.</p>
          <p>Teeth are written driver:driven. The gearbox ratio is input shaft turns per output shaft turn. The overall ratio multiplies in the primary drive (36:76 teeth) and the chain (16:45 teeth), so it is crankshaft turns per rear wheel turn.</p>
          <table>
            <thead><tr><th scope="col">Gear</th><th scope="col">Teeth</th><th scope="col">Ratio</th><th scope="col">Overall</th></tr></thead>
            <tbody>
              <tr><th scope="row">1st</th><td>13:37</td><td>2.846</td><td>16.90</td></tr>
              <tr><th scope="row">2nd</th><td>17:33</td><td>1.941</td><td>11.53</td></tr>
              <tr><th scope="row">3rd</th><td>19:31</td><td>1.632</td><td>9.69</td></tr>
              <tr><th scope="row">4th</th><td>21:29</td><td>1.381</td><td>8.20</td></tr>
              <tr><th scope="row">5th</th><td>23:27</td><td>1.174</td><td>6.97</td></tr>
              <tr><th scope="row">6th</th><td>24:26</td><td>1.083</td><td>6.43</td></tr>
            </tbody>
          </table>
        </div>
      </noscript>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
